<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&family=Cormorant+Garamond:wght@500;600&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;width:1500px;height:500px;overflow:hidden;}
  body{
    background:#FAF7F2;
    display:flex;align-items:center;justify-content:center;gap:64px;
    position:relative;
  }
  body::after{
    content:"";position:absolute;left:0;right:0;bottom:0;height:10px;background:#2D5A2D;
  }
  .mark{width:300px;height:300px;flex:0 0 auto;clip-path:circle(46% at 50% 50%);object-fit:cover;}
  .text{display:flex;flex-direction:column;}
  .name-ja{
    font-family:"Noto Serif JP",serif;font-weight:700;font-size:84px;color:#1A1A1A;
    letter-spacing:0.06em;line-height:1.1;
  }
  .name-en{
    font-family:"Cormorant Garamond",serif;font-weight:600;font-size:34px;color:#6B8E5A;
    letter-spacing:0.32em;margin-top:14px;text-transform:uppercase;
  }
  .tagline{
    font-family:"Noto Sans JP",sans-serif;font-weight:500;font-size:34px;color:#2D5A2D;
    letter-spacing:0.18em;margin-top:30px;
  }
  .tagline .x{color:#A0382A;padding:0 6px;}
</style></head>
<body>
  <img class="mark" src="../logo-primary.png" alt="">

  <div class="text">
    <div class="name-ja">Yテック工房</div>
    <div class="name-en">Y-Tech Koubou</div>
    <div class="tagline">IT <span class="x">×</span> 建築 <span class="x">×</span> 海外</div>
  </div>
</body></html>
