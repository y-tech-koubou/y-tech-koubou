<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="Yテック工房 横組ロックアップ">
  <title>Yテック工房 / Y-Tech Koubou</title>
  <rect width="800" height="200" fill="#FAF7F2"/>

  <!-- Mark (左) -->
  <g transform="translate(10,10) scale(0.9)">
    <circle cx="100" cy="100" r="88" fill="none" stroke="#2D5A2D" stroke-width="6"/>
    <g fill="#2D5A2D">
      <path d="M100 38 Q 116 64 100 96 Q 84 64 100 38 Z"/>
      <path d="M52 58 Q 80 70 80 102 Q 50 90 52 58 Z"/>
      <path d="M148 58 Q 120 70 120 102 Q 150 90 148 58 Z"/>
    </g>
    <g stroke="#2D5A2D" stroke-width="7" fill="none" stroke-linecap="round">
      <path d="M70 100 L 130 156"/>
      <path d="M130 100 L 70 156"/>
    </g>
  </g>

  <!-- 区切り罫 -->
  <line x1="210" y1="50" x2="210" y2="150" stroke="#D6CFC2" stroke-width="1"/>

  <!-- 日本語ロゴタイプ -->
  <text x="240" y="100"
        font-family="'Noto Serif JP', 'Yu Mincho', 'Hiragino Mincho ProN', serif"
        font-size="52" font-weight="600" fill="#2D5A2D" letter-spacing="4">Yテック工房</text>

  <!-- 英語ロゴタイプ -->
  <text x="240" y="138"
        font-family="'Cormorant Garamond', 'Times New Roman', serif"
        font-size="22" font-weight="500" fill="#6B8E5A" letter-spacing="6">Y-TECH KOUBOU</text>
</svg>
