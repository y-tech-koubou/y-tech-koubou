<!doctype html>
<!-- OG画像ソース（1200×630）。再生成: chrome --headless=new --window-size=1200,630 --screenshot=assets\og.png file:///...og-source.html
     2026-09-18 アフリカ×日本リブランド: 新ロゴ(柄入り)・見出し=Ink・eyebrow=藍深・下端=キテンゲ柄帯 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #F7F5F2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: "Noto Sans JP", "Yu Gothic UI", "Meiryo", sans-serif;
    text-align: center;
    position: relative;
    padding-bottom: 18px;
  }
  .logo { width: 152px; height: 152px; margin-bottom: 30px; }
  .eyebrow {
    font-family: "Space Grotesk", "Segoe UI", Arial, sans-serif;
    font-size: 21px;
    letter-spacing: 0.5em;
    color: #282950;
    margin-bottom: 18px;
  }
  h1 {
    font-size: 92px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: #1A1C1E;
    line-height: 1;
    margin-bottom: 30px;
  }
  .tag {
    font-size: 34px;
    font-weight: 500;
    letter-spacing: 0.22em;
    color: #1A1C1E;
  }
  .domain {
    position: absolute;
    bottom: 44px;
    left: 0;
    right: 0;
    font-family: "Space Grotesk", "Segoe UI", Arial, sans-serif;
    font-size: 19px;
    letter-spacing: 0.18em;
    color: #5E646B;
  }
  /* 下端のキテンゲ柄帯（portal/index.html の --pattern-kitenge と同じ定義） */
  .band {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 18px;
    background:
      radial-gradient(circle at 7px 7px, #C50507 0 2px, transparent 2.5px),
      radial-gradient(circle at 21px 21px, #F7F5F2 0 2px, transparent 2.5px),
      linear-gradient(135deg, transparent 0 38%, #E89408 38% 47%, transparent 47% 100%),
      #0B3DA4;
    background-size: 28px 28px;
  }
  .line-l { position: absolute; top: 72px; bottom: 72px; left: 56px; width: 2px; background: #282950; }
</style>
</head>
<body>
  <div class="line-l"></div>
  <img class="logo" src="logo-mark.svg" alt="">
  <div class="eyebrow">Y &middot; TECH &middot; KOUBOU</div>
  <h1>Yテック工房</h1>
  <div class="tag">IT &times; 建築 &times; 海外</div>
  <div class="domain">y-tech-koubou.com</div>
  <div class="band"></div>
</body>
</html>
