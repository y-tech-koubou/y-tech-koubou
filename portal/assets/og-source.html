<!doctype html>
<!-- OG画像ソース（1200×630）。再生成: cdp-portal-shot.ps1 -Url file:///...og-source.html -Width 1200 -Height 630 -Out assets\og.png -->
<html lang="ja">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: linear-gradient(160deg, #FAF7F2 0%, #F3EEE5 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
    text-align: center;
    position: relative;
  }
  .logo { width: 148px; height: 148px; margin-bottom: 34px; }
  .eyebrow {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 21px;
    letter-spacing: 0.5em;
    color: #42693A;
    margin-bottom: 18px;
  }
  h1 {
    font-size: 92px;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: #2D5A2D;
    line-height: 1;
    margin-bottom: 30px;
  }
  .tag {
    font-size: 34px;
    font-weight: 500;
    letter-spacing: 0.22em;
    color: #1A1A1A;
  }
  .domain {
    position: absolute;
    bottom: 34px;
    left: 0;
    right: 0;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 19px;
    letter-spacing: 0.18em;
    color: #5A606B;
  }
  /* Apple流タイルの墨を1筋だけ（下端のブランドバー） */
  .bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 10px;
    background: #0F1A0F;
  }
</style>
</head>
<body>
  <img class="logo" src="logo-mark.png" alt="">
  <div class="eyebrow">Y &middot; TECH &middot; KOUBOU</div>
  <h1>Yテック工房</h1>
  <div class="tag">IT &times; 建築 &times; 海外</div>
  <div class="domain">y-tech-koubou.com</div>
  <div class="bar"></div>
</body>
</html>
