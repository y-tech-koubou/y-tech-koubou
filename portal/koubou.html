<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工房の庭 — Yテック工房</title>
  <meta name="description" content="Yテック工房がつくってきた道具を、ひとつの庭に建物として並べた3D空間。見回して、気になる建物からそれぞれのサイトへ。">
  <link rel="canonical" href="https://www.y-tech-koubou.com/koubou">
  <link rel="icon" type="image/png" href="assets/favicon.png?v=2">
  <meta property="og:type" content="website">
  <meta property="og:title" content="工房の庭 — Yテック工房">
  <meta property="og:description" content="つくってきた道具を、ひとつの庭に建物として並べた3D空間。">
  <meta property="og:url" content="https://www.y-tech-koubou.com/koubou">
  <meta property="og:image" content="https://www.y-tech-koubou.com/assets/og.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap">
  <style>
:root {
  /* Heritage Design Tokens（正本: index.html の :root と同値） */
  --kokemidori: #B8422E;
  --wakaba: #C2674B;
  --wakaba-deep: #9E3522;
  --kinari: #F7F5F2;
  --tonoko: #EEEAE3;
  --shikkoku: #1A1C1E;
  --nibiiro: #5E646B;
  --usuzumi: #DAD6CF;
  --rounded-sm: 4px;
  --rounded-md: 8px;
  --serif-en: 'Space Grotesk', 'Public Sans', 'Helvetica Neue', sans-serif;
  --sans-jp: 'Public Sans', 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Yu Gothic UI', system-ui, sans-serif;
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --dur: 0.34s;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--kinari);
  color: var(--shikkoku);
  font-family: var(--sans-jp);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--kokemidori); text-decoration: none; }

/* ====== 3Dキャンバス ====== */
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#stage.grabbing { cursor: grabbing; }
#stage.pickable { cursor: pointer; }

/* ====== ヘッダー（戻る導線） ====== */
.bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px; pointer-events: none;
}
.bar .back {
  pointer-events: auto;
  display: inline-flex; align-items: center; gap: 10px;
  background: rgba(250, 247, 242, 0.82);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--usuzumi); border-radius: var(--rounded-md);
  padding: 8px 14px; color: var(--shikkoku);
  font-size: 14px; font-weight: 600;
  transition: border-color var(--dur) var(--ease-out);
}
.bar .back:hover { border-color: var(--wakaba); text-decoration: none; }
.bar .back img { display: block; }
.bar .back .arrow { color: var(--nibiiro); font-family: var(--serif-en); }

/* ====== 説明パネル ====== */
.panel {
  position: fixed; left: 20px; top: 72px; z-index: 15;
  max-width: 330px;
  background: rgba(250, 247, 242, 0.86);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--usuzumi); border-radius: var(--rounded-md);
  padding: 18px 20px 16px;
}
.panel .kicker {
  font-family: var(--serif-en); font-size: 11px; font-weight: 600;
  letter-spacing: 0.18em; text-transform: uppercase; color: var(--wakaba-deep);
}
.panel h1 { margin: 6px 0 8px; font-size: 24px; line-height: 1.3; letter-spacing: 0.02em; }
.panel p { margin: 0; font-size: 13.5px; line-height: 1.8; color: var(--nibiiro); }
.panel .hint { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--usuzumi); font-size: 12px; }

/* ====== スポットのラベル（3D座標へ投影） ====== */
.spot-label {
  position: fixed; left: 0; top: 0; z-index: 10;
  transform: translate(-50%, -100%);
  appearance: none; border: 1px solid var(--usuzumi); cursor: pointer;
  background: rgba(250, 247, 242, 0.9);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-radius: var(--rounded-md);
  padding: 7px 12px 8px; text-align: center;
  font-family: var(--sans-jp); color: var(--shikkoku);
  white-space: nowrap; line-height: 1.35;
  transition: border-color 0.2s var(--ease-out), box-shadow 0.2s var(--ease-out);
}
.spot-label .nm { display: block; font-size: 13px; font-weight: 700; }
.spot-label .sub {
  display: block; font-family: var(--serif-en); font-size: 9.5px; font-weight: 600;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--nibiiro);
}
.spot-label:hover, .spot-label.active {
  border-color: var(--kokemidori);
  box-shadow: 0 4px 18px rgba(26, 28, 30, 0.12);
}
.spot-label.static { cursor: default; background: rgba(250, 247, 242, 0.62); }
.spot-label.static .nm { font-weight: 500; font-size: 12px; color: var(--nibiiro); }
.spot-label[hidden] { display: none; }

/* ====== 行き先チップ ====== */
.legend {
  position: fixed; left: 0; right: 0; bottom: 18px; z-index: 15;
  display: flex; justify-content: center; padding: 0 16px;
}
.legend .chips {
  display: flex; gap: 8px; max-width: 100%;
  overflow-x: auto; padding: 4px; scrollbar-width: none;
}
.legend .chips::-webkit-scrollbar { display: none; }
.legend button {
  appearance: none; cursor: pointer; flex-shrink: 0;
  background: rgba(250, 247, 242, 0.86);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--usuzumi); border-radius: 999px;
  padding: 8px 16px; font-family: var(--sans-jp);
  font-size: 12.5px; font-weight: 600; color: var(--shikkoku);
  transition: border-color 0.2s var(--ease-out), color 0.2s var(--ease-out);
}
.legend button:hover { border-color: var(--kokemidori); color: var(--kokemidori); }

/* ====== ローディング／フォールバック ====== */
.veil {
  position: fixed; inset: 0; z-index: 40;
  display: flex; align-items: center; justify-content: center;
  background: var(--kinari);
  transition: opacity 0.7s var(--ease-out);
  font-size: 14px; color: var(--nibiiro); letter-spacing: 0.08em;
}
.veil.done { opacity: 0; pointer-events: none; }
.fallback {
  position: fixed; inset: 0; z-index: 30; overflow: auto;
  background: var(--kinari); padding: 96px 24px 48px; display: none;
}
.fallback.show { display: block; }
.fallback .in { max-width: 560px; margin: 0 auto; }
.fallback h2 { font-size: 20px; }
.fallback p { color: var(--nibiiro); font-size: 14px; line-height: 1.8; }
.fallback ul { list-style: none; margin: 24px 0 0; padding: 0; }
.fallback li + li { margin-top: 10px; }
.fallback a {
  display: block; padding: 14px 18px; border: 1px solid var(--usuzumi);
  border-radius: var(--rounded-md); background: #fff; color: var(--shikkoku); font-weight: 600;
}
.fallback a:hover { border-color: var(--kokemidori); text-decoration: none; }
.fallback a span { display: block; font-weight: 400; font-size: 12px; color: var(--nibiiro); }

@media (max-width: 640px) {
  /* チップ列は横スクロール＝両端フェードで続きがあることを示す */
  .legend .chips {
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 20px, #000 calc(100% - 28px), transparent 100%);
    mask-image: linear-gradient(90deg, transparent 0, #000 20px, #000 calc(100% - 28px), transparent 100%);
    padding-right: 20px;
  }
  .panel { left: 12px; right: 12px; top: 64px; max-width: none; padding: 14px 16px 12px; }
  .panel h1 { font-size: 19px; }
  .panel p { font-size: 12.5px; }
  .panel .hint { margin-top: 8px; padding-top: 8px; }
  .bar { padding: 10px 12px; }
}
  </style>
</head>
<body>

  <canvas id="stage" aria-label="工房の庭の3Dビュー。ドラッグで見回し、建物を選ぶと各サイトが開きます。"></canvas>

  <div class="bar">
    <a class="back" href="./">
      <span class="arrow" aria-hidden="true">&larr;</span>
      <img src="assets/logo-mark.png?v=2" alt="" width="22" height="22">
      <span>Yテック工房</span>
    </a>
  </div>

  <div class="panel">
    <span class="kicker">Koubou Garden</span>
    <h1>工房の庭</h1>
    <p>続けた分だけ、庭に形が残る。<br>これまでに出荷した道具が、ここに建っています。</p>
    <p class="hint">ドラッグ / スワイプで見回す。建物を選ぶと、そのサイトが開きます。</p>
  </div>

  <nav class="legend" aria-label="庭の行き先">
    <div class="chips" id="chips"></div>
  </nav>

  <div class="veil" id="veil">庭を準備しています</div>

  <div class="fallback" id="fallback">
    <div class="in">
      <h2>工房の庭</h2>
      <p>お使いの環境では3D表示ができないため、一覧でご案内します。</p>
      <ul id="fallback-list"></ul>
    </div>
  </div>

  <noscript>
    <div class="fallback show"><div class="in">
      <h2>工房の庭</h2>
      <p>この空間の表示には JavaScript が必要です。<a href="./">ポータルのトップ</a>から各アプリをご覧いただけます。</p>
    </div></div>
  </noscript>

  <script src="assets/three.min.js"></script>
  <script src="assets/OrbitControls.js"></script>
  <script>
  (function () {
    'use strict';

    // ====== 庭の住人（建物） ======
    // wall/roof は Heritage トークン系。木の緑だけはブランドのシグネチャ例外（index.html のヒーローの木と同族）。
    var SPOTS = [
      { key: 'kenchiku', name: '建築資格工房', sub: 'Architect Exam Prep',
        url: 'https://1architectexam.com', external: true,
        pos: [7.5, 0, 12.5], size: { w: 5.8, d: 4.8, h: 3.2, roofH: 2.4 },
        wall: 0xF4EFE7, roof: 0xB8422E, main: true },
      { key: 'english', name: 'English工房', sub: 'IELTS / TOEFL / TOEIC',
        url: 'https://english-koubou.vercel.app', external: true,
        pos: [14.5, 0, 4.5], size: { w: 4.8, d: 4.2, h: 2.8, roofH: 2.1 },
        wall: 0xEFE6D8, roof: 0x9E3522, gable: 'side' },
      { key: 'africa', name: 'アフリカ語工房', sub: 'African Languages',
        url: 'https://africa-lingo.vercel.app', external: true,
        pos: [14, 0, -9], size: { w: 4.4, d: 3.8, h: 2.7, roofH: 2.0 },
        wall: 0xEAD9C4, roof: 0xC2674B },
      { key: 'yoshino', name: '吉野工務店', sub: 'Web 制作例',
        url: 'https://yoshino-koumuten.com', external: true,
        pos: [-18, 0, -5], size: { w: 4.6, d: 4.0, h: 2.8, roofH: 2.0 },
        wall: 0xF4EFE7, roof: 0x41464D, gable: 'side' },
      { key: 'hugtime', name: 'Hugtime salon', sub: 'Web 制作例',
        url: 'https://hugtime-salon.com', external: true,
        pos: [-15.5, 0, -10.5], size: { w: 4.2, d: 3.6, h: 2.6, roofH: 1.9 },
        wall: 0xEFE6D8, roof: 0x41464D, lift: 1.5 },  /* 隣の吉野工務店とラベルが同じ高さ帯で重なるため1段上げる */
      { key: 'contact', name: '相談の窓口', sub: 'Contact',
        url: './#contact', external: false,
        pos: [7.5, 0, -15.5], size: { w: 3.2, d: 2.8, h: 2.3, roofH: 1.7 },
        wall: 0xE7CDBE, roof: 0x9E3522 }
    ];

    var canvas = document.getElementById('stage');
    var veil = document.getElementById('veil');
    /* ?static=1 はQA撮影用: 導入演出と自動回転を止め、決め打ちの画角で描く */
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches
      || /[?&]static=1/.test(window.location.search);

    // ====== WebGL 判定（不可なら一覧フォールバック） ======
    function webglOk() {
      try {
        var c = document.createElement('canvas');
        return !!(window.WebGLRenderingContext && (c.getContext('webgl') || c.getContext('experimental-webgl')));
      } catch (e) { return false; }
    }
    function showFallback() {
      var box = document.getElementById('fallback');
      var list = document.getElementById('fallback-list');
      SPOTS.forEach(function (s) {
        var li = document.createElement('li');
        var a = document.createElement('a');
        a.href = s.url;
        if (s.external) { a.target = '_blank'; a.rel = 'noopener'; }
        a.innerHTML = '<span></span>';
        a.insertBefore(document.createTextNode(s.name), a.firstChild);
        a.querySelector('span').textContent = s.sub;
        li.appendChild(a);
        list.appendChild(li);
      });
      box.classList.add('show');
      veil.classList.add('done');
      canvas.style.display = 'none';
      document.querySelector('.legend').style.display = 'none';
      document.querySelector('.panel .hint').textContent = '一覧から各サイトへどうぞ。';
    }
    if (!window.THREE || !webglOk()) { showFallback(); return; }

    // ====== 基本セットアップ ======
    var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;   /* ベタ塗り感を消す要・光のレンジを写真寄りに */
    renderer.toneMappingExposure = 1.02;

    var scene = new THREE.Scene();
    scene.background = new THREE.Color(0xF0EBE1);
    scene.fog = new THREE.Fog(0xEFE9DC, 52, 120);

    /* 空: 頂点カラーのドーム（上=淡い青灰 → 地平=温かい生成り） */
    (function () {
      var geo = new THREE.SphereGeometry(130, 24, 16);
      var pos = geo.attributes.position;
      var cols = new Float32Array(pos.count * 3);
      var top = new THREE.Color(0xA3C4DA), hor = new THREE.Color(0xF3EDDE), c = new THREE.Color();
      for (var i = 0; i < pos.count; i++) {
        var t = Math.max(0, Math.min(1, pos.getY(i) / 130));
        c.copy(hor).lerp(top, Math.pow(t, 0.62));
        cols[i * 3] = c.r; cols[i * 3 + 1] = c.g; cols[i * 3 + 2] = c.b;
      }
      geo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
      var sky = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false }));
      scene.add(sky);
    })();

    var camera = new THREE.PerspectiveCamera(42, 1, 0.1, 200);
    /* 縦画面は同じ画角だと木しか入らないため、アスペクトに応じて引きを強め、注視点も少し上げる */
    function homeCam() {
      var aspect = window.innerWidth / Math.max(1, window.innerHeight);
      var s = aspect < 0.7 ? 1.55 : (aspect < 1.0 ? 1.3 : 1.0);
      return new THREE.Vector3(19 * s, 13.5 * s, 30 * s);
    }
    function homeTgt() {
      var aspect = window.innerWidth / Math.max(1, window.innerHeight);
      return new THREE.Vector3(0, aspect < 0.7 ? 4.5 : 2.2, 0);
    }
    var HOME_TGT = homeTgt();
    camera.position.copy(reduce ? homeCam() : new THREE.Vector3(0, 44, 64));

    var controls = new THREE.OrbitControls(camera, canvas);
    controls.target.copy(HOME_TGT);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.enablePan = false;
    controls.minDistance = 9;
    controls.maxDistance = 78;
    controls.maxPolarAngle = 1.38;   /* 地面の下に潜らない */
    controls.minPolarAngle = 0.35;
    controls.autoRotate = !reduce;
    controls.autoRotateSpeed = 0.45;

    // ====== 光（午後のやわらかい庭・影をはっきり落とす） ======
    scene.add(new THREE.HemisphereLight(0xDDE9F0, 0xB0A890, 0.4));
    var sun = new THREE.DirectionalLight(0xFFEFD8, 1.12);
    sun.position.set(24, 32, 10);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -34; sun.shadow.camera.right = 34;
    sun.shadow.camera.top = 34; sun.shadow.camera.bottom = -34;
    sun.shadow.camera.far = 100;
    sun.shadow.bias = -0.0006;
    sun.shadow.radius = 3;
    scene.add(sun);
    /* 逆側からごく弱いフィル光（影面が潰れて黒くならないように） */
    var fill = new THREE.DirectionalLight(0xCBD8E2, 0.22);
    fill.position.set(-18, 14, -20);
    scene.add(fill);

    // ====== 素材ヘルパ（プロシージャルテクスチャ: 漆喰/芝/石/木のむら） ======
    function noiseTexture(baseHex, opt) {
      opt = opt || {};
      var size = 256;
      var cv = document.createElement('canvas'); cv.width = cv.height = size;
      var cx = cv.getContext('2d');
      var base = new THREE.Color(baseHex);
      cx.fillStyle = '#' + base.getHexString();
      cx.fillRect(0, 0, size, size);
      var grains = opt.grains || 2600;
      for (var i = 0; i < grains; i++) {
        var v = (Math.random() - 0.5) * (opt.contrast || 0.10);
        var c2 = base.clone().offsetHSL(0, opt.hueJitter || 0, v);
        cx.fillStyle = '#' + c2.getHexString();
        cx.globalAlpha = 0.30 + Math.random() * 0.35;
        var s = opt.grainSize || 2;
        cx.fillRect(Math.random() * size, Math.random() * size, s + Math.random() * s, s + Math.random() * s);
      }
      /* 横方向の淡い筋（漆喰のコテむら/芝の流れ） */
      if (opt.streaks) {
        for (var j = 0; j < opt.streaks; j++) {
          var vy = Math.random() * size;
          var c3 = base.clone().offsetHSL(0, 0, (Math.random() - 0.5) * 0.06);
          cx.fillStyle = '#' + c3.getHexString();
          cx.globalAlpha = 0.16;
          cx.fillRect(0, vy, size, 1 + Math.random() * 2);
        }
      }
      cx.globalAlpha = 1;
      var tex = new THREE.CanvasTexture(cv);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.encoding = THREE.sRGBEncoding;
      if (opt.repeat) tex.repeat.set(opt.repeat[0], opt.repeat[1]);
      return tex;
    }
    function mat(color, rough) {
      return new THREE.MeshStandardMaterial({ color: color, roughness: rough == null ? 0.92 : rough, metalness: 0 });
    }
    /* テクスチャは色ごとにキャッシュ・マテリアルは棟ごとに新規（ホバー発光が他棟に波及しないように） */
    var texCache = {};
    function cachedTex(kind, colorHex, opt) {
      var k = kind + colorHex;
      if (!texCache[k]) texCache[k] = noiseTexture(colorHex, opt);
      return texCache[k];
    }
    function plasterMat(colorHex) {
      return new THREE.MeshStandardMaterial({
        map: cachedTex('p', colorHex, { contrast: 0.07, grains: 3200, streaks: 26, repeat: [1.6, 1.0] }),
        roughness: 0.95, metalness: 0
      });
    }
    function roofMat(colorHex) {
      return new THREE.MeshStandardMaterial({
        map: cachedTex('r', colorHex, { contrast: 0.12, grains: 2200, streaks: 60, repeat: [2.0, 1.2] }),
        roughness: 0.88, metalness: 0, flatShading: true
      });
    }
    var woodMat = new THREE.MeshStandardMaterial({
      map: noiseTexture(0x54402E, { contrast: 0.14, grains: 1600, streaks: 90, repeat: [1, 1] }),
      roughness: 0.9, metalness: 0
    });
    var trunkMat = new THREE.MeshStandardMaterial({
      map: noiseTexture(0x6A4832, { contrast: 0.16, grains: 2000, streaks: 110, repeat: [2, 2] }),
      roughness: 0.95, metalness: 0
    });
    var doorMat = new THREE.MeshStandardMaterial({
      map: noiseTexture(0x3E4145, { contrast: 0.08, grains: 1200, streaks: 60, repeat: [1, 1] }),
      roughness: 0.82, metalness: 0
    });
    var windowMat = new THREE.MeshStandardMaterial({ color: 0xFDF6E3, roughness: 0.35, emissive: 0xE8CE9E, emissiveIntensity: 0.5 });
    var frameMat = mat(0xEFEAE0, 0.85);
    var stoneMat = new THREE.MeshStandardMaterial({
      map: noiseTexture(0xD9D2C2, { contrast: 0.10, grains: 2600, repeat: [1, 1] }),
      roughness: 0.98, metalness: 0, flatShading: true
    });
    var plinthMat = new THREE.MeshStandardMaterial({
      map: noiseTexture(0xCEC5B2, { contrast: 0.12, grains: 2400, repeat: [2, 0.5] }),
      roughness: 0.98, metalness: 0
    });

    // ====== 地面（芝）・広場・飛び石の小道 ======
    var GRASS = 0x9DB183;   /* 落ち着いたセージの芝（庭の実在感の要） */
    var ground = new THREE.Mesh(new THREE.CircleGeometry(70, 72), new THREE.MeshStandardMaterial({
      map: noiseTexture(GRASS, { contrast: 0.10, grains: 3600, streaks: 40, repeat: [26, 26] }),
      roughness: 1.0, metalness: 0
    }));
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    /* 木の根元の広場: 土色の円 + 縁石 */
    var plaza = new THREE.Mesh(new THREE.CircleGeometry(5.6, 48), new THREE.MeshStandardMaterial({
      map: noiseTexture(0xCBB99B, { contrast: 0.12, grains: 3000, repeat: [5, 5] }),
      roughness: 1.0, metalness: 0
    }));
    plaza.rotation.x = -Math.PI / 2;
    plaza.position.y = 0.015;
    plaza.receiveShadow = true;
    scene.add(plaza);
    for (var ei = 0; ei < 26; ei++) {
      var ea = (ei / 26) * Math.PI * 2;
      var edge = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.14, 0.3), stoneMat);
      edge.position.set(Math.cos(ea) * 5.75, 0.07, Math.sin(ea) * 5.75);
      edge.rotation.y = -ea + Math.PI / 2 + (Math.random() - 0.5) * 0.2;
      edge.castShadow = edge.receiveShadow = true;
      scene.add(edge);
    }

    /* 小道: 直線プレーンをやめて飛び石に */
    function addPath(to) {
      var v = new THREE.Vector3(to[0], 0, to[2]);
      var len = v.length();
      var dir = v.clone().normalize();
      var side = new THREE.Vector3(-dir.z, 0, dir.x);
      for (var d0 = 6.4; d0 < len - 2.6; d0 += 1.15) {
        var p = dir.clone().multiplyScalar(d0 + (Math.random() - 0.5) * 0.18)
          .add(side.clone().multiplyScalar((Math.random() - 0.5) * 0.5));
        var st = new THREE.Mesh(new THREE.CylinderGeometry(0.46, 0.5, 0.09, 7), stoneMat);
        st.scale.x = 0.8 + Math.random() * 0.45;
        st.scale.z = 0.62 + Math.random() * 0.3;
        st.position.set(p.x, 0.045, p.z);
        st.rotation.y = Math.random() * Math.PI;
        st.castShadow = st.receiveShadow = true;
        scene.add(st);
      }
    }
    SPOTS.forEach(function (s) { addPath(s.pos); });

    // ====== 中央の木（ヒーローの緑の木と同族＝シグネチャ） ======
    /* 頂点を不規則に散らした樹冠＋フラットシェーディングで「風に膨らんだ葉の塊」に */
    function leafGeo(r, jit) {
      var g = new THREE.IcosahedronGeometry(r, 1);
      var p = g.attributes.position;
      for (var i = 0; i < p.count; i++) {
        p.setXYZ(i,
          p.getX(i) * (1 + (Math.random() - 0.5) * jit),
          p.getY(i) * (0.82 + (Math.random() - 0.5) * jit),   /* 縦に少し潰す＝樹冠らしく */
          p.getZ(i) * (1 + (Math.random() - 0.5) * jit));
      }
      g.computeVertexNormals();
      return g;
    }
    function leafMat(c) {
      return new THREE.MeshStandardMaterial({ color: c, roughness: 0.95, metalness: 0, flatShading: true });
    }
    var tree = new THREE.Group();
    var trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 1.05, 5.6, 9), trunkMat);
    trunk.position.y = 2.8; trunk.rotation.y = 0.4;
    trunk.castShadow = true;
    tree.add(trunk);
    /* 根張り: 幹の足元に小さな瘤 */
    for (var ri = 0; ri < 5; ri++) {
      var ra = (ri / 5) * Math.PI * 2 + 0.3;
      var root = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.34, 0.9, 6), trunkMat);
      root.position.set(Math.cos(ra) * 0.75, 0.32, Math.sin(ra) * 0.75);
      root.rotation.z = Math.cos(ra) * 0.55;
      root.rotation.x = -Math.sin(ra) * 0.55;
      root.castShadow = true;
      tree.add(root);
    }
    /* 大枝2本 */
    var br1 = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.30, 2.6, 7), trunkMat);
    br1.position.set(1.0, 5.3, 0.4); br1.rotation.z = -0.7; br1.castShadow = true;
    tree.add(br1);
    var br2 = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.26, 2.2, 7), trunkMat);
    br2.position.set(-0.9, 5.6, -0.5); br2.rotation.z = 0.75; br2.rotation.x = 0.3; br2.castShadow = true;
    tree.add(br2);
    var CANOPY = [
      { c: 0x2E5F3B, r: 3.0, p: [0, 7.6, 0] },
      { c: 0x3C6F47, r: 2.3, p: [2.2, 6.6, 0.7] },
      { c: 0x4B7F52, r: 2.1, p: [-2.1, 6.5, -0.8] },
      { c: 0x426F41, r: 1.8, p: [0.5, 6.3, 2.0] },
      { c: 0x578B57, r: 1.6, p: [-0.9, 9.0, 1.0] },
      { c: 0x35663D, r: 1.7, p: [-0.2, 6.4, -2.1] }
    ];
    var canopy = [];
    CANOPY.forEach(function (l) {
      var s = new THREE.Mesh(leafGeo(l.r, 0.28), leafMat(l.c));
      s.position.set(l.p[0], l.p[1], l.p[2]);
      s.rotation.set(Math.random(), Math.random() * 3, Math.random());
      s.castShadow = true;
      canopy.push(s); tree.add(s);
    });
    scene.add(tree);

    // ====== 建物ファクトリ（切妻屋根・軒の出・基礎・窓枠で「建築」に寄せる） ======
    var pickables = [];
    /* 切妻プリズム: 底辺span×高さroofH の三角形を length ぶん押し出す（ridge=押し出し軸） */
    function gablePrism(span, roofH, length, material) {
      var sh = new THREE.Shape();
      sh.moveTo(-span / 2, 0); sh.lineTo(span / 2, 0); sh.lineTo(0, roofH); sh.closePath();
      var geo = new THREE.ExtrudeGeometry(sh, { depth: length, bevelEnabled: false });
      geo.translate(0, 0, -length / 2);
      var m = new THREE.Mesh(geo, material);
      m.castShadow = m.receiveShadow = true;
      return m;
    }
    function buildSpot(spot, index) {
      var g = new THREE.Group();
      var sz = spot.size;
      var wall = plasterMat(spot.wall);
      var roof = roofMat(spot.roof);
      var OV = 0.42;   /* 軒の出 */

      /* 基礎（ひとまわり大きい低い石場） */
      var plinth = new THREE.Mesh(new THREE.BoxGeometry(sz.w + 0.3, 0.3, sz.d + 0.3), plinthMat);
      plinth.position.y = 0.15;
      plinth.castShadow = plinth.receiveShadow = true;
      g.add(plinth);

      var body = new THREE.Mesh(new THREE.BoxGeometry(sz.w, sz.h, sz.d), wall);
      body.position.y = 0.3 + sz.h / 2;
      body.castShadow = body.receiveShadow = true;
      g.add(body);

      /* 屋根: 正面切妻(ridgeが正面向き=妻面が入口側)と平入り(ridgeが横)を混在させて街並みに */
      var roofGrp = new THREE.Group();
      var cap;
      if (spot.gable === 'side') {
        cap = gablePrism(sz.d + OV * 2, sz.roofH, sz.w + OV * 2, roof);
        cap.rotation.y = Math.PI / 2;
      } else {
        cap = gablePrism(sz.w + OV * 2, sz.roofH, sz.d + OV * 2, roof);
      }
      roofGrp.add(cap);
      /* 妻壁（三角の漆喰面）: プリズム両端に薄い三角を貼る */
      var ridgeAxisLen = (spot.gable === 'side') ? (sz.w) : (sz.d);
      var triSpan = (spot.gable === 'side') ? (sz.d) : (sz.w);
      var triSh = new THREE.Shape();
      triSh.moveTo(-triSpan / 2, 0); triSh.lineTo(triSpan / 2, 0); triSh.lineTo(0, sz.roofH - 0.06);
      triSh.closePath();
      [-1, 1].forEach(function (end) {
        var tw = new THREE.Mesh(new THREE.ExtrudeGeometry(triSh, { depth: 0.06, bevelEnabled: false }), wall);
        tw.position.z = end * (ridgeAxisLen / 2 - 0.03) - 0.03;
        if (spot.gable === 'side') { tw.rotation.y = Math.PI / 2; tw.position.z = 0; tw.position.x = end * (sz.w / 2 - 0.03) - 0.03; }
        tw.castShadow = true;
        roofGrp.add(tw);
      });
      /* 棟木カバー */
      var ridge = new THREE.Mesh(
        new THREE.BoxGeometry((spot.gable === 'side') ? 0.24 : 0.24, 0.14,
          (spot.gable === 'side') ? sz.w + OV * 2 + 0.05 : sz.d + OV * 2 + 0.05), roof);
      if (spot.gable === 'side') { ridge.rotation.y = Math.PI / 2; }
      ridge.position.y = sz.roofH + 0.02;
      ridge.castShadow = true;
      roofGrp.add(ridge);
      roofGrp.position.y = 0.3 + sz.h - 0.02;
      g.add(roofGrp);

      /* 入口: 枠+扉+踏み石+取っ手 */
      var doorW = Math.min(1.05, sz.w * 0.24), doorH = Math.min(1.9, sz.h * 0.62);
      var dframe = new THREE.Mesh(new THREE.BoxGeometry(doorW + 0.18, doorH + 0.12, 0.1), frameMat);
      dframe.position.set(0, 0.3 + doorH / 2, sz.d / 2 + 0.03);
      g.add(dframe);
      var door = new THREE.Mesh(new THREE.BoxGeometry(doorW, doorH, 0.08), doorMat);
      door.position.set(0, 0.3 + doorH / 2, sz.d / 2 + 0.08);
      g.add(door);
      var knob = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), mat(0xC9B78A, 0.4));
      knob.position.set(doorW * 0.3, 0.3 + doorH * 0.48, sz.d / 2 + 0.13);
      g.add(knob);
      var step = new THREE.Mesh(new THREE.BoxGeometry(doorW + 0.5, 0.12, 0.7), stoneMat);
      step.position.set(0, 0.06, sz.d / 2 + 0.42);
      step.castShadow = step.receiveShadow = true;
      g.add(step);

      /* 窓: 枠(奥) + ガラス(手前inset) + 窓台。背面(通りから見える側)にも同じ窓を付けて無地壁を消す */
      [1, -1].forEach(function (face) {
        [-1, 1].forEach(function (side) {
          var wz = face * (sz.d / 2);
          var wf = new THREE.Mesh(new THREE.BoxGeometry(sz.w * 0.2, sz.h * 0.26, 0.08), frameMat);
          wf.position.set(side * sz.w * 0.28, 0.3 + sz.h * 0.60, wz + face * 0.03);
          g.add(wf);
          var win = new THREE.Mesh(new THREE.BoxGeometry(sz.w * 0.15, sz.h * 0.2, 0.06), windowMat);
          win.position.set(side * sz.w * 0.28, 0.3 + sz.h * 0.60, wz + face * 0.06);
          g.add(win);
          var sill = new THREE.Mesh(new THREE.BoxGeometry(sz.w * 0.22, 0.07, 0.16), frameMat);
          sill.position.set(side * sz.w * 0.28, 0.3 + sz.h * 0.60 - sz.h * 0.13 - 0.05, wz + face * 0.1);
          sill.castShadow = true;
          g.add(sill);
        });
      });

      if (spot.main) {
        var chim = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.9, 0.6), plinthMat);
        chim.position.set(sz.w * 0.26, 0.3 + sz.h + sz.roofH * 0.55, -sz.d * 0.16);
        chim.castShadow = true;
        g.add(chim);
        var chimCap = new THREE.Mesh(new THREE.BoxGeometry(0.74, 0.12, 0.74), stoneMat);
        chimCap.position.set(sz.w * 0.26, 0.3 + sz.h + sz.roofH * 0.55 + 1.0, -sz.d * 0.16);
        g.add(chimCap);
      }

      /* 看板（板のみ。文字は HTML ラベルが担う） */
      var post = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.07, 1.1, 6), woodMat);
      post.position.set(sz.w * 0.44, 0.55, sz.d / 2 + 0.95);
      post.castShadow = true;
      g.add(post);
      var board = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.5, 0.07), woodMat);
      board.position.set(sz.w * 0.44, 1.12, sz.d / 2 + 0.95);
      board.rotation.y = -0.12;
      board.castShadow = true;
      g.add(board);

      g.position.set(spot.pos[0], 0, spot.pos[2]);
      g.lookAt(new THREE.Vector3(0, 0, 0));
      scene.add(g);

      spot.group = g;
      spot.mats = [wall, roof];
      spot.anchor = new THREE.Vector3(spot.pos[0], sz.h + sz.roofH + 1.2 + (spot.lift || 0), spot.pos[2]);
      g.traverse(function (o) { if (o.isMesh) { o.userData.spot = index; pickables.push(o); } });
    }
    SPOTS.forEach(buildSpot);

    // ====== 苗床（次の道具を育てている場所・リンクなし） ======
    var nursery = new THREE.Group();
    var bedSoil = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.26, 1.5), new THREE.MeshStandardMaterial({
      map: cachedTex('soil', 0x6E5844, { contrast: 0.14, grains: 2600, repeat: [3, 1.5] }), roughness: 1.0, metalness: 0
    }));
    bedSoil.position.y = 0.2; bedSoil.receiveShadow = true;
    nursery.add(bedSoil);
    /* 木枠 */
    [[0, 0.9, 3.6, 0.16], [0, -0.9, 3.6, 0.16]].forEach(function (r) {
      var rail = new THREE.Mesh(new THREE.BoxGeometry(r[2], 0.3, r[3]), woodMat);
      rail.position.set(r[0], 0.19, r[1]); rail.castShadow = true;
      nursery.add(rail);
    });
    [[-1.72, 0], [1.72, 0]].forEach(function (r) {
      var rail = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.3, 1.96), woodMat);
      rail.position.set(r[0], 0.19, r[1]); rail.castShadow = true;
      nursery.add(rail);
    });
    /* 苗: 短い茎＋小さな葉塊 */
    [-1, 0, 1].forEach(function (i) {
      var stem = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.04, 0.4, 5), trunkMat);
      stem.position.set(i * 1.0, 0.5, (i % 2) * 0.2);
      nursery.add(stem);
      var leaf = new THREE.Mesh(leafGeo(0.24 + 0.07 * (i + 1), 0.5), leafMat(0x578B57));
      leaf.position.set(i * 1.0, 0.74 + 0.05 * (i + 1), (i % 2) * 0.2);
      leaf.castShadow = true;
      nursery.add(leaf);
    });
    nursery.position.set(-8, 0, 12);
    scene.add(nursery);
    var NURSERY_ANCHOR = new THREE.Vector3(-8, 1.7, 12);

    // ====== 添景（雑木・岩・草むら・花） ======
    function smallTree(scale, hueTop) {
      var g = new THREE.Group();
      var t = new THREE.Mesh(new THREE.CylinderGeometry(0.08 * scale, 0.18 * scale, 1.3 * scale, 6), trunkMat);
      t.position.y = 0.65 * scale; t.castShadow = true;
      g.add(t);
      var top = new THREE.Mesh(leafGeo(0.85 * scale, 0.5), leafMat(hueTop));
      top.position.y = 1.7 * scale;
      top.castShadow = true;
      g.add(top);
      var top2 = new THREE.Mesh(leafGeo(0.55 * scale, 0.5), leafMat(0x4B7F52));
      top2.position.set(0.45 * scale, 2.1 * scale, 0.2 * scale);
      top2.castShadow = true;
      g.add(top2);
      return g;
    }
    function scatter() {
      var i, a, r;
      var greens = [0x2E5F3B, 0x3C6F47, 0x426F41];
      for (i = 0; i < 10; i++) {
        a = (i / 10) * Math.PI * 2 + 0.8;  /* 既定カメラの正面(azimuth≒32°)に木を置かない位相 */
        r = 24 + (i % 3) * 3.6;
        var tr = smallTree(0.9 + (i % 3) * 0.45, greens[i % 3]);
        tr.rotation.y = i * 1.3;
        tr.position.set(Math.cos(a) * r, 0, Math.sin(a) * r);
        scene.add(tr);
      }
      for (i = 0; i < 7; i++) {
        a = (i / 7) * Math.PI * 2 + 1.25;
        r = 19 + (i % 2) * 7;
        var rg = new THREE.DodecahedronGeometry(0.45 + (i % 3) * 0.3, 0);
        var rock = new THREE.Mesh(rg, stoneMat);
        rock.position.set(Math.cos(a) * r, 0.26, Math.sin(a) * r);
        rock.rotation.set(i, i * 0.7, 0);
        rock.scale.y = 0.7;
        rock.castShadow = rock.receiveShadow = true;
        scene.add(rock);
      }
      /* 草むら: 小さな葉群を面で散らす（芝テクスチャに立体の粗を足す） */
      var tuftMat1 = leafMat(0x6F8A58), tuftMat2 = leafMat(0x7C9765);
      for (i = 0; i < 90; i++) {
        a = Math.random() * Math.PI * 2;
        r = 6.8 + Math.random() * 24;
        var tuft = new THREE.Mesh(new THREE.ConeGeometry(0.1 + Math.random() * 0.1, 0.28 + Math.random() * 0.3, 5), (i % 2) ? tuftMat1 : tuftMat2);
        tuft.position.set(Math.cos(a) * r, 0.12, Math.sin(a) * r);
        tuft.rotation.set((Math.random() - 0.5) * 0.3, Math.random() * 3, (Math.random() - 0.5) * 0.3);
        scene.add(tuft);
      }
      /* 花: 白と土器色の点花を株で */
      var flw1 = mat(0xF3EFE4, 0.7), flw2 = mat(0xC2674B, 0.7);
      for (i = 0; i < 46; i++) {
        a = Math.random() * Math.PI * 2;
        r = 6.6 + Math.random() * 20;
        var f = new THREE.Mesh(new THREE.SphereGeometry(0.06 + Math.random() * 0.05, 6, 5), (i % 3) ? flw1 : flw2);
        f.position.set(Math.cos(a) * r, 0.1, Math.sin(a) * r);
        scene.add(f);
      }
    }
    scatter();

    // ====== 漂う種（ブランドの種モチーフ・控えめ） ======
    var seeds = null, seedBase = [];
    if (!reduce) {
      var COUNT = 36;
      var posArr = new Float32Array(COUNT * 3);
      for (var si = 0; si < COUNT; si++) {
        var sa = Math.random() * Math.PI * 2;
        var sr = 4 + Math.random() * 22;
        posArr[si * 3] = Math.cos(sa) * sr;
        posArr[si * 3 + 1] = 1.5 + Math.random() * 7;
        posArr[si * 3 + 2] = Math.sin(sa) * sr;
        seedBase.push(posArr[si * 3 + 1]);
      }
      var seedGeo = new THREE.BufferGeometry();
      seedGeo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
      seeds = new THREE.Points(seedGeo, new THREE.PointsMaterial({
        color: 0xC2674B, size: 0.16, transparent: true, opacity: 0.55, sizeAttenuation: true
      }));
      scene.add(seeds);
    }

    // ====== HTMLラベル ======
    var labels = [];
    SPOTS.forEach(function (spot, i) {
      var b = document.createElement('button');
      b.className = 'spot-label';
      b.type = 'button';
      b.innerHTML = '<span class="nm"></span><span class="sub"></span>';
      b.querySelector('.nm').textContent = spot.name;
      b.querySelector('.sub').textContent = spot.sub;
      b.setAttribute('aria-label', spot.name + ' — ' + spot.sub + 'を開く');
      b.addEventListener('click', function () { visit(spot); });
      b.addEventListener('mouseenter', function () { setHover(i); });
      b.addEventListener('mouseleave', function () { setHover(-1); });
      document.body.appendChild(b);
      labels.push({ el: b, anchor: spot.anchor });
      spot.label = b;
    });
    var nurseryLabel = document.createElement('span');
    nurseryLabel.className = 'spot-label static';
    nurseryLabel.innerHTML = '<span class="nm">苗床 — 次の道具を育てています</span>';
    document.body.appendChild(nurseryLabel);
    labels.push({ el: nurseryLabel, anchor: NURSERY_ANCHOR });

    var _v = new THREE.Vector3();
    function placeLabels() {
      var w = canvas.clientWidth, h = canvas.clientHeight;
      labels.forEach(function (l) {
        _v.copy(l.anchor).project(camera);
        var behind = _v.z > 1;
        var dist = camera.position.distanceTo(l.anchor);
        if (behind || dist > 70) { l.el.hidden = true; return; }
        l.el.hidden = false;
        var x = (_v.x * 0.5 + 0.5) * w;
        var y = (-_v.y * 0.5 + 0.5) * h;
        l.el.style.transform = 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px) translate(-50%, -100%)';
        l.el.style.opacity = dist > 55 ? '0.45' : '1';
      });
    }

    // ====== 行き先チップ ======
    var chips = document.getElementById('chips');
    function addChip(txt, fn) {
      var b = document.createElement('button');
      b.type = 'button'; b.textContent = txt;
      b.addEventListener('click', fn);
      chips.appendChild(b);
    }
    addChip('全体を見る', function () { flyTo(homeCam(), homeTgt()); });
    SPOTS.forEach(function (spot) {
      addChip(spot.name, function () {
        var p = new THREE.Vector3(spot.pos[0], 0, spot.pos[2]);
        var dir = p.clone().normalize();
        var cam = p.clone().add(dir.multiplyScalar(10)).setY(6.5);
        flyTo(cam, p.clone().setY(2));
      });
    });

    // ====== カメラ移動（チップ／導入） ======
    var tween = null;
    var userMoved = false;   /* 一度でも操作したら自動回転は戻さない */
    var booted = false;      /* 初回フレーム前の resize でホーム画角を上書きしない */
    function flyTo(camPos, tgt, dur, isIntro) {
      controls.autoRotate = false;
      if (!isIntro) userMoved = true;
      tween = {
        t0: performance.now(), dur: dur || 1200, intro: !!isIntro,
        c0: camera.position.clone(), c1: camPos.clone(),
        g0: controls.target.clone(), g1: tgt.clone()
      };
    }
    function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

    // ====== ホバー／クリック ======
    var ray = new THREE.Raycaster();
    var pointer = new THREE.Vector2();
    var hoverIdx = -1;
    function setHover(i) {
      if (i === hoverIdx) return;
      if (hoverIdx >= 0) {
        SPOTS[hoverIdx].mats.forEach(function (m) { m.emissive.setHex(0x000000); });
        SPOTS[hoverIdx].label.classList.remove('active');
      }
      hoverIdx = i;
      if (i >= 0) {
        SPOTS[i].mats.forEach(function (m) { m.emissive.setHex(0x2A1008); });
        SPOTS[i].label.classList.add('active');
      }
      canvas.classList.toggle('pickable', i >= 0);
    }
    function pick(e) {
      var r = canvas.getBoundingClientRect();
      pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
      pointer.y = -((e.clientY - r.top) / r.height) * 2 + 1;
      ray.setFromCamera(pointer, camera);
      var hit = ray.intersectObjects(pickables, false);
      return hit.length ? hit[0].object.userData.spot : -1;
    }
    function visit(spot) {
      if (spot.external) { window.open(spot.url, '_blank', 'noopener'); }
      else { window.location.href = spot.url; }
    }

    var downX = 0, downY = 0;
    canvas.addEventListener('pointerdown', function (e) {
      downX = e.clientX; downY = e.clientY;
      controls.autoRotate = false;
      userMoved = true;
      canvas.classList.add('grabbing');
    });
    canvas.addEventListener('pointerup', function (e) {
      canvas.classList.remove('grabbing');
      if (Math.abs(e.clientX - downX) < 7 && Math.abs(e.clientY - downY) < 7) {
        var i = pick(e);
        if (i >= 0) visit(SPOTS[i]);
      }
    });
    canvas.addEventListener('pointermove', function (e) {
      if (e.pointerType === 'touch') return;
      setHover(pick(e));
    });
    canvas.addEventListener('pointerleave', function () { setHover(-1); });

    // ====== リサイズ・描画ループ ======
    function resize() {
      var w = window.innerWidth, h = window.innerHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      /* まだ操作していなければ、画面の縦横に合わせてホーム画角を取り直す（画面回転対応） */
      if (booted && !userMoved) {
        if (tween) { tween.c1.copy(homeCam()); tween.g1.copy(homeTgt()); }
        else { camera.position.copy(homeCam()); controls.target.copy(homeTgt()); }
      }
    }
    window.addEventListener('resize', resize);
    resize();

    var hidden = false;
    document.addEventListener('visibilitychange', function () { hidden = document.hidden; });

    var first = true;
    function loop(now) {
      requestAnimationFrame(loop);
      if (hidden) return;

      if (tween) {
        var k = Math.min(1, (now - tween.t0) / tween.dur);
        var e = ease(k);
        camera.position.lerpVectors(tween.c0, tween.c1, e);
        controls.target.lerpVectors(tween.g0, tween.g1, e);
        if (k >= 1) {
          if (tween.intro && !userMoved && !reduce) controls.autoRotate = true;
          tween = null;
        }
      }
      controls.update();

      if (!reduce) {
        var t = now * 0.001;
        canopy.forEach(function (s, i) { s.position.y = CANOPY[i].p[1] + Math.sin(t * 0.7 + i * 1.7) * 0.07; });
        if (seeds) {
          var arr = seeds.geometry.attributes.position.array;
          for (var i2 = 0; i2 < seedBase.length; i2++) {
            arr[i2 * 3 + 1] = seedBase[i2] + Math.sin(t * 0.5 + i2 * 0.9) * 0.4;
          }
          seeds.geometry.attributes.position.needsUpdate = true;
        }
      }

      placeLabels();
      renderer.render(scene, camera);

      if (first) {
        first = false;
        booted = true;
        veil.classList.add('done');
        if (!reduce) flyTo(homeCam(), homeTgt(), 2000, true);
      }
    }
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
