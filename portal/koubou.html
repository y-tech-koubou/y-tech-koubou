<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工房の庭 — Yテック工房</title>
  <meta name="description" content="Yテック工房がつくってきた道具を、ひとつの庭に建物として並べた3D空間。見回して、気になる建物からそれぞれのサイトへ。">
  <link rel="canonical" href="https://www.y-tech-koubou.com/koubou">
  <link rel="icon" type="image/png" href="assets/favicon.png?v=2">
  <meta property="og:type" content="website">
  <meta property="og:title" content="工房の庭 — Yテック工房">
  <meta property="og:description" content="つくってきた道具を、ひとつの庭に建物として並べた3D空間。">
  <meta property="og:url" content="https://www.y-tech-koubou.com/koubou">
  <meta property="og:image" content="https://www.y-tech-koubou.com/assets/og.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap">
  <style>
:root {
  /* Heritage Design Tokens（正本: index.html の :root と同値） */
  --kokemidori: #B8422E;
  --wakaba: #C2674B;
  --wakaba-deep: #9E3522;
  --kinari: #F7F5F2;
  --tonoko: #EEEAE3;
  --shikkoku: #1A1C1E;
  --nibiiro: #5E646B;
  --usuzumi: #DAD6CF;
  --rounded-sm: 4px;
  --rounded-md: 8px;
  --serif-en: 'Space Grotesk', 'Public Sans', 'Helvetica Neue', sans-serif;
  --sans-jp: 'Public Sans', 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Yu Gothic UI', system-ui, sans-serif;
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --dur: 0.34s;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--kinari);
  color: var(--shikkoku);
  font-family: var(--sans-jp);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--kokemidori); text-decoration: none; }

/* ====== 3Dキャンバス ====== */
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#stage.grabbing { cursor: grabbing; }
#stage.pickable { cursor: pointer; }

/* ====== ヘッダー（戻る導線） ====== */
.bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px; pointer-events: none;
}
.bar .back {
  pointer-events: auto;
  display: inline-flex; align-items: center; gap: 10px;
  background: rgba(250, 247, 242, 0.82);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--usuzumi); border-radius: var(--rounded-md);
  padding: 8px 14px; color: var(--shikkoku);
  font-size: 14px; font-weight: 600;
  transition: border-color var(--dur) var(--ease-out);
}
.bar .back:hover { border-color: var(--wakaba); text-decoration: none; }
.bar .back img { display: block; }
.bar .back .arrow { color: var(--nibiiro); font-family: var(--serif-en); }

/* ====== 説明パネル ====== */
.panel {
  position: fixed; left: 20px; top: 72px; z-index: 15;
  max-width: 330px;
  background: rgba(250, 247, 242, 0.86);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--usuzumi); border-radius: var(--rounded-md);
  padding: 18px 20px 16px;
}
.panel .kicker {
  font-family: var(--serif-en); font-size: 11px; font-weight: 600;
  letter-spacing: 0.18em; text-transform: uppercase; color: var(--wakaba-deep);
}
.panel h1 { margin: 6px 0 8px; font-size: 24px; line-height: 1.3; letter-spacing: 0.02em; }
.panel p { margin: 0; font-size: 13.5px; line-height: 1.8; color: var(--nibiiro); }
.panel .hint { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--usuzumi); font-size: 12px; }

/* ====== スポットのラベル（3D座標へ投影） ====== */
.spot-label {
  position: fixed; left: 0; top: 0; z-index: 10;
  transform: translate(-50%, -100%);
  appearance: none; border: 1px solid var(--usuzumi); cursor: pointer;
  background: rgba(250, 247, 242, 0.9);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-radius: var(--rounded-md);
  padding: 7px 12px 8px; text-align: center;
  font-family: var(--sans-jp); color: var(--shikkoku);
  white-space: nowrap; line-height: 1.35;
  transition: border-color 0.2s var(--ease-out), box-shadow 0.2s var(--ease-out);
}
.spot-label .nm { display: block; font-size: 13px; font-weight: 700; }
.spot-label .sub {
  display: block; font-family: var(--serif-en); font-size: 9.5px; font-weight: 600;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--nibiiro);
}
.spot-label:hover, .spot-label.active {
  border-color: var(--kokemidori);
  box-shadow: 0 4px 18px rgba(26, 28, 30, 0.12);
}
.spot-label.static { cursor: default; background: rgba(250, 247, 242, 0.62); }
.spot-label.static .nm { font-weight: 500; font-size: 12px; color: var(--nibiiro); }
.spot-label[hidden] { display: none; }

/* ====== 行き先チップ ====== */
.legend {
  position: fixed; left: 0; right: 0; bottom: 18px; z-index: 15;
  display: flex; justify-content: center; padding: 0 16px;
}
.legend .chips {
  display: flex; gap: 8px; max-width: 100%;
  overflow-x: auto; padding: 4px; scrollbar-width: none;
}
.legend .chips::-webkit-scrollbar { display: none; }
.legend button {
  appearance: none; cursor: pointer; flex-shrink: 0;
  background: rgba(250, 247, 242, 0.86);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--usuzumi); border-radius: 999px;
  padding: 8px 16px; font-family: var(--sans-jp);
  font-size: 12.5px; font-weight: 600; color: var(--shikkoku);
  transition: border-color 0.2s var(--ease-out), color 0.2s var(--ease-out);
}
.legend button:hover { border-color: var(--kokemidori); color: var(--kokemidori); }

/* ====== ローディング／フォールバック ====== */
.veil {
  position: fixed; inset: 0; z-index: 40;
  display: flex; align-items: center; justify-content: center;
  background: var(--kinari);
  transition: opacity 0.7s var(--ease-out);
  font-size: 14px; color: var(--nibiiro); letter-spacing: 0.08em;
}
.veil.done { opacity: 0; pointer-events: none; }
.fallback {
  position: fixed; inset: 0; z-index: 30; overflow: auto;
  background: var(--kinari); padding: 96px 24px 48px; display: none;
}
.fallback.show { display: block; }
.fallback .in { max-width: 560px; margin: 0 auto; }
.fallback h2 { font-size: 20px; }
.fallback p { color: var(--nibiiro); font-size: 14px; line-height: 1.8; }
.fallback ul { list-style: none; margin: 24px 0 0; padding: 0; }
.fallback li + li { margin-top: 10px; }
.fallback a {
  display: block; padding: 14px 18px; border: 1px solid var(--usuzumi);
  border-radius: var(--rounded-md); background: #fff; color: var(--shikkoku); font-weight: 600;
}
.fallback a:hover { border-color: var(--kokemidori); text-decoration: none; }
.fallback a span { display: block; font-weight: 400; font-size: 12px; color: var(--nibiiro); }

@media (max-width: 640px) {
  /* チップ列は横スクロール＝両端フェードで続きがあることを示す */
  .legend .chips {
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 20px, #000 calc(100% - 28px), transparent 100%);
    mask-image: linear-gradient(90deg, transparent 0, #000 20px, #000 calc(100% - 28px), transparent 100%);
    padding-right: 20px;
  }
  .panel { left: 12px; right: 12px; top: 64px; max-width: none; padding: 14px 16px 12px; }
  .panel h1 { font-size: 19px; }
  .panel p { font-size: 12.5px; }
  .panel .hint { margin-top: 8px; padding-top: 8px; }
  .bar { padding: 10px 12px; }
}
  </style>
</head>
<body>

  <canvas id="stage" aria-label="工房の庭の3Dビュー。ドラッグで見回し、建物を選ぶと各サイトが開きます。"></canvas>

  <div class="bar">
    <a class="back" href="./">
      <span class="arrow" aria-hidden="true">&larr;</span>
      <img src="assets/logo-mark.png?v=2" alt="" width="22" height="22">
      <span>Yテック工房</span>
    </a>
  </div>

  <div class="panel">
    <span class="kicker">Koubou Garden</span>
    <h1>工房の庭</h1>
    <p>続けた分だけ、庭に形が残る。<br>これまでに出荷した道具が、ここに建っています。</p>
    <p class="hint">ドラッグ / スワイプで見回す。建物を選ぶと、そのサイトが開きます。</p>
  </div>

  <nav class="legend" aria-label="庭の行き先">
    <div class="chips" id="chips"></div>
  </nav>

  <div class="veil" id="veil">庭を準備しています</div>

  <div class="fallback" id="fallback">
    <div class="in">
      <h2>工房の庭</h2>
      <p>お使いの環境では3D表示ができないため、一覧でご案内します。</p>
      <ul id="fallback-list"></ul>
    </div>
  </div>

  <noscript>
    <div class="fallback show"><div class="in">
      <h2>工房の庭</h2>
      <p>この空間の表示には JavaScript が必要です。<a href="./">ポータルのトップ</a>から各アプリをご覧いただけます。</p>
    </div></div>
  </noscript>

  <script src="assets/three.min.js"></script>
  <script src="assets/OrbitControls.js"></script>
  <script>
  (function () {
    'use strict';

    // ====== 庭の住人（建物） ======
    // wall/roof は Heritage トークン系。木の緑だけはブランドのシグネチャ例外（index.html のヒーローの木と同族）。
    var SPOTS = [
      { key: 'kenchiku', name: '建築資格工房', sub: 'Architect Exam Prep',
        url: 'https://1architectexam.com', external: true,
        pos: [7.5, 0, 12.5], size: { w: 5.8, d: 4.8, h: 3.2, roofH: 2.4 },
        wall: 0xF4EFE7, roof: 0xB8422E, main: true },
      { key: 'english', name: 'English工房', sub: 'IELTS / TOEFL / TOEIC',
        url: 'https://english-koubou.vercel.app', external: true,
        pos: [14.5, 0, 4.5], size: { w: 4.8, d: 4.2, h: 2.8, roofH: 2.1 },
        wall: 0xEFE6D8, roof: 0x9E3522 },
      { key: 'africa', name: 'アフリカ語工房', sub: 'African Languages',
        url: 'https://africa-lingo.vercel.app', external: true,
        pos: [14, 0, -9], size: { w: 4.4, d: 3.8, h: 2.7, roofH: 2.0 },
        wall: 0xEAD9C4, roof: 0xC2674B },
      { key: 'yoshino', name: '吉野工務店', sub: 'Web 制作例',
        url: 'https://yoshino-koumuten.com', external: true,
        pos: [-18, 0, -5], size: { w: 4.6, d: 4.0, h: 2.8, roofH: 2.0 },
        wall: 0xF4EFE7, roof: 0x2A2D30 },
      { key: 'hugtime', name: 'Hugtime salon', sub: 'Web 制作例',
        url: 'https://hugtime-salon.com', external: true,
        pos: [-15.5, 0, -10.5], size: { w: 4.2, d: 3.6, h: 2.6, roofH: 1.9 },
        wall: 0xEFE6D8, roof: 0x2A2D30, lift: 1.5 },  /* 隣の吉野工務店とラベルが同じ高さ帯で重なるため1段上げる */
      { key: 'contact', name: '相談の窓口', sub: 'Contact',
        url: './#contact', external: false,
        pos: [7.5, 0, -15.5], size: { w: 3.2, d: 2.8, h: 2.3, roofH: 1.7 },
        wall: 0xE7CDBE, roof: 0x9E3522 }
    ];

    var canvas = document.getElementById('stage');
    var veil = document.getElementById('veil');
    /* ?static=1 はQA撮影用: 導入演出と自動回転を止め、決め打ちの画角で描く */
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches
      || /[?&]static=1/.test(window.location.search);

    // ====== WebGL 判定（不可なら一覧フォールバック） ======
    function webglOk() {
      try {
        var c = document.createElement('canvas');
        return !!(window.WebGLRenderingContext && (c.getContext('webgl') || c.getContext('experimental-webgl')));
      } catch (e) { return false; }
    }
    function showFallback() {
      var box = document.getElementById('fallback');
      var list = document.getElementById('fallback-list');
      SPOTS.forEach(function (s) {
        var li = document.createElement('li');
        var a = document.createElement('a');
        a.href = s.url;
        if (s.external) { a.target = '_blank'; a.rel = 'noopener'; }
        a.innerHTML = '<span></span>';
        a.insertBefore(document.createTextNode(s.name), a.firstChild);
        a.querySelector('span').textContent = s.sub;
        li.appendChild(a);
        list.appendChild(li);
      });
      box.classList.add('show');
      veil.classList.add('done');
      canvas.style.display = 'none';
      document.querySelector('.legend').style.display = 'none';
      document.querySelector('.panel .hint').textContent = '一覧から各サイトへどうぞ。';
    }
    if (!window.THREE || !webglOk()) { showFallback(); return; }

    // ====== 基本セットアップ ======
    var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputEncoding = THREE.sRGBEncoding;

    var scene = new THREE.Scene();
    scene.background = new THREE.Color(0xF7F5F2);          /* Limestone */
    scene.fog = new THREE.Fog(0xF7F5F2, 46, 95);

    var camera = new THREE.PerspectiveCamera(42, 1, 0.1, 200);
    /* 縦画面は同じ画角だと木しか入らないため、アスペクトに応じて引きを強め、注視点も少し上げる */
    function homeCam() {
      var aspect = window.innerWidth / Math.max(1, window.innerHeight);
      var s = aspect < 0.7 ? 1.55 : (aspect < 1.0 ? 1.3 : 1.0);
      return new THREE.Vector3(19 * s, 13.5 * s, 30 * s);
    }
    function homeTgt() {
      var aspect = window.innerWidth / Math.max(1, window.innerHeight);
      return new THREE.Vector3(0, aspect < 0.7 ? 4.5 : 2.2, 0);
    }
    var HOME_TGT = homeTgt();
    camera.position.copy(reduce ? homeCam() : new THREE.Vector3(0, 44, 64));

    var controls = new THREE.OrbitControls(camera, canvas);
    controls.target.copy(HOME_TGT);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.enablePan = false;
    controls.minDistance = 9;
    controls.maxDistance = 78;
    controls.maxPolarAngle = 1.38;   /* 地面の下に潜らない */
    controls.minPolarAngle = 0.35;
    controls.autoRotate = !reduce;
    controls.autoRotateSpeed = 0.45;

    // ====== 光（昼のやわらかい庭） ======
    scene.add(new THREE.HemisphereLight(0xFFFFFF, 0xD8D2C6, 0.85));
    var sun = new THREE.DirectionalLight(0xFFF3E2, 0.95);
    sun.position.set(20, 30, 14);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -34; sun.shadow.camera.right = 34;
    sun.shadow.camera.top = 34; sun.shadow.camera.bottom = -34;
    sun.shadow.camera.far = 90;
    sun.shadow.bias = -0.0008;
    scene.add(sun);

    // ====== 素材ヘルパ ======
    function mat(color, rough) {
      return new THREE.MeshStandardMaterial({ color: color, roughness: rough == null ? 0.92 : rough, metalness: 0 });
    }
    var woodMat = mat(0x4A3A2C, 0.9);
    var trunkMat = mat(0x6E4B33, 0.95);
    var doorMat = mat(0x3C3F42, 0.85);
    var windowMat = new THREE.MeshStandardMaterial({ color: 0xFBF9F4, roughness: 0.4, emissive: 0xC9BFA8, emissiveIntensity: 0.35 });

    // ====== 地面・広場・小道 ======
    var ground = new THREE.Mesh(new THREE.CircleGeometry(36, 64), mat(0xEDE8DF, 0.98));
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    var plaza = new THREE.Mesh(new THREE.CircleGeometry(6.2, 48), mat(0xE4DED1, 0.98));
    plaza.rotation.x = -Math.PI / 2;
    plaza.position.y = 0.012;
    plaza.receiveShadow = true;
    scene.add(plaza);

    function addPath(to) {
      var v = new THREE.Vector3(to[0], 0, to[2]);
      var len = v.length() - 3.4;
      var geo = new THREE.PlaneGeometry(1.5, len);
      var m = new THREE.Mesh(geo, mat(0xE0D8C9, 0.98));
      m.rotation.x = -Math.PI / 2;
      var mid = v.clone().multiplyScalar(0.5 + (3.4 * 0.5) / v.length());
      m.position.set(mid.x, 0.008, mid.z);
      m.rotation.z = Math.atan2(v.x, v.z);
      m.receiveShadow = true;
      scene.add(m);
    }
    SPOTS.forEach(function (s) { addPath(s.pos); });

    // ====== 中央の木（ヒーローの緑の木と同族＝シグネチャ） ======
    var tree = new THREE.Group();
    var trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.85, 5.4, 8), trunkMat);
    trunk.position.y = 2.7; trunk.castShadow = true;
    tree.add(trunk);
    var CANOPY = [
      { c: 0x2F6B3F, r: 2.9, p: [0, 7.2, 0] },
      { c: 0x3E7C4C, r: 2.2, p: [1.9, 6.3, 0.6] },
      { c: 0x57945F, r: 2.0, p: [-1.8, 6.2, -0.7] },
      { c: 0x4E8A56, r: 1.7, p: [0.4, 6.0, 1.8] },
      { c: 0x6FA86F, r: 1.4, p: [-0.7, 8.6, 0.9] }
    ];
    var canopy = [];
    CANOPY.forEach(function (l) {
      var s = new THREE.Mesh(new THREE.IcosahedronGeometry(l.r, 1), mat(l.c, 0.95));
      s.position.set(l.p[0], l.p[1], l.p[2]);
      s.castShadow = true;
      canopy.push(s); tree.add(s);
    });
    scene.add(tree);

    // ====== 建物ファクトリ ======
    var pickables = [];
    function buildSpot(spot, index) {
      var g = new THREE.Group();
      var sz = spot.size;
      var wall = mat(spot.wall, 0.92);
      var roof = mat(spot.roof, 0.85);

      var body = new THREE.Mesh(new THREE.BoxGeometry(sz.w, sz.h, sz.d), wall);
      body.position.y = sz.h / 2;
      body.castShadow = body.receiveShadow = true;
      g.add(body);

      var cap = new THREE.Mesh(new THREE.ConeGeometry(Math.max(sz.w, sz.d) * 0.78, sz.roofH, 4), roof);
      cap.position.y = sz.h + sz.roofH / 2 - 0.02;
      cap.rotation.y = Math.PI / 4;
      cap.castShadow = true;
      g.add(cap);

      var door = new THREE.Mesh(new THREE.BoxGeometry(sz.w * 0.2, sz.h * 0.52, 0.12), doorMat);
      door.position.set(0, sz.h * 0.26, sz.d / 2 + 0.05);
      g.add(door);

      [-1, 1].forEach(function (side) {
        var win = new THREE.Mesh(new THREE.BoxGeometry(sz.w * 0.16, sz.h * 0.2, 0.1), windowMat);
        win.position.set(side * sz.w * 0.26, sz.h * 0.58, sz.d / 2 + 0.05);
        g.add(win);
      });

      if (spot.main) {
        var chim = new THREE.Mesh(new THREE.BoxGeometry(0.55, 1.6, 0.55), mat(0xB9AFA2, 0.95));
        chim.position.set(sz.w * 0.28, sz.h + sz.roofH * 0.7, -sz.d * 0.18);
        chim.castShadow = true;
        g.add(chim);
      }

      /* 看板（板のみ。文字は HTML ラベルが担う） */
      var post = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 1.1, 6), woodMat);
      post.position.set(sz.w * 0.42, 0.55, sz.d / 2 + 0.9);
      g.add(post);
      var board = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.5, 0.08), woodMat);
      board.position.set(sz.w * 0.42, 1.15, sz.d / 2 + 0.9);
      g.add(board);

      g.position.set(spot.pos[0], 0, spot.pos[2]);
      g.lookAt(new THREE.Vector3(0, 0, 0));
      scene.add(g);

      spot.group = g;
      spot.mats = [wall, roof];
      spot.anchor = new THREE.Vector3(spot.pos[0], sz.h + sz.roofH + 0.9 + (spot.lift || 0), spot.pos[2]);
      g.traverse(function (o) { if (o.isMesh) { o.userData.spot = index; pickables.push(o); } });
    }
    SPOTS.forEach(buildSpot);

    // ====== 苗床（次の道具を育てている場所・リンクなし） ======
    var nursery = new THREE.Group();
    var bed = new THREE.Mesh(new THREE.BoxGeometry(3.4, 0.3, 1.7), mat(0x8A6E52, 0.98));
    bed.position.y = 0.15; bed.receiveShadow = true;
    nursery.add(bed);
    [-1, 0, 1].forEach(function (i) {
      var sprout = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.55 + 0.14 * (i + 1), 6), mat(0x6FA86F, 0.95));
      sprout.position.set(i * 1.0, 0.55, 0);
      sprout.castShadow = true;
      nursery.add(sprout);
    });
    nursery.position.set(-8, 0, 12);
    scene.add(nursery);
    var NURSERY_ANCHOR = new THREE.Vector3(-8, 1.7, 12);

    // ====== 添景（低木・岩） ======
    function scatter() {
      var i, a, r;
      for (i = 0; i < 9; i++) {
        a = (i / 9) * Math.PI * 2 + 0.8;  /* 既定カメラの正面(azimuth≒32°)に木を置かない位相 */
        r = 24 + (i % 3) * 3.4;
        var bush = new THREE.Group();
        var t = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.16, 0.9, 6), trunkMat);
        t.position.y = 0.45;
        var top = new THREE.Mesh(new THREE.ConeGeometry(0.85 + (i % 3) * 0.25, 2.0 + (i % 4) * 0.5, 7), mat(i % 2 ? 0x3E7C4C : 0x57945F, 0.95));
        top.position.y = 1.9; top.castShadow = true;
        bush.add(t, top);
        bush.position.set(Math.cos(a) * r, 0, Math.sin(a) * r);
        scene.add(bush);
      }
      for (i = 0; i < 6; i++) {
        a = (i / 6) * Math.PI * 2 + 1.2;
        r = 20 + (i % 2) * 6;
        var rock = new THREE.Mesh(new THREE.DodecahedronGeometry(0.5 + (i % 3) * 0.3, 0), mat(0xC8C0B2, 0.98));
        rock.position.set(Math.cos(a) * r, 0.3, Math.sin(a) * r);
        rock.rotation.set(i, i * 0.7, 0);
        rock.castShadow = true;
        scene.add(rock);
      }
    }
    scatter();

    // ====== 漂う種（ブランドの種モチーフ・控えめ） ======
    var seeds = null, seedBase = [];
    if (!reduce) {
      var COUNT = 36;
      var posArr = new Float32Array(COUNT * 3);
      for (var si = 0; si < COUNT; si++) {
        var sa = Math.random() * Math.PI * 2;
        var sr = 4 + Math.random() * 22;
        posArr[si * 3] = Math.cos(sa) * sr;
        posArr[si * 3 + 1] = 1.5 + Math.random() * 7;
        posArr[si * 3 + 2] = Math.sin(sa) * sr;
        seedBase.push(posArr[si * 3 + 1]);
      }
      var seedGeo = new THREE.BufferGeometry();
      seedGeo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
      seeds = new THREE.Points(seedGeo, new THREE.PointsMaterial({
        color: 0xC2674B, size: 0.16, transparent: true, opacity: 0.55, sizeAttenuation: true
      }));
      scene.add(seeds);
    }

    // ====== HTMLラベル ======
    var labels = [];
    SPOTS.forEach(function (spot, i) {
      var b = document.createElement('button');
      b.className = 'spot-label';
      b.type = 'button';
      b.innerHTML = '<span class="nm"></span><span class="sub"></span>';
      b.querySelector('.nm').textContent = spot.name;
      b.querySelector('.sub').textContent = spot.sub;
      b.setAttribute('aria-label', spot.name + ' — ' + spot.sub + 'を開く');
      b.addEventListener('click', function () { visit(spot); });
      b.addEventListener('mouseenter', function () { setHover(i); });
      b.addEventListener('mouseleave', function () { setHover(-1); });
      document.body.appendChild(b);
      labels.push({ el: b, anchor: spot.anchor });
      spot.label = b;
    });
    var nurseryLabel = document.createElement('span');
    nurseryLabel.className = 'spot-label static';
    nurseryLabel.innerHTML = '<span class="nm">苗床 — 次の道具を育てています</span>';
    document.body.appendChild(nurseryLabel);
    labels.push({ el: nurseryLabel, anchor: NURSERY_ANCHOR });

    var _v = new THREE.Vector3();
    function placeLabels() {
      var w = canvas.clientWidth, h = canvas.clientHeight;
      labels.forEach(function (l) {
        _v.copy(l.anchor).project(camera);
        var behind = _v.z > 1;
        var dist = camera.position.distanceTo(l.anchor);
        if (behind || dist > 70) { l.el.hidden = true; return; }
        l.el.hidden = false;
        var x = (_v.x * 0.5 + 0.5) * w;
        var y = (-_v.y * 0.5 + 0.5) * h;
        l.el.style.transform = 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px) translate(-50%, -100%)';
        l.el.style.opacity = dist > 55 ? '0.45' : '1';
      });
    }

    // ====== 行き先チップ ======
    var chips = document.getElementById('chips');
    function addChip(txt, fn) {
      var b = document.createElement('button');
      b.type = 'button'; b.textContent = txt;
      b.addEventListener('click', fn);
      chips.appendChild(b);
    }
    addChip('全体を見る', function () { flyTo(homeCam(), homeTgt()); });
    SPOTS.forEach(function (spot) {
      addChip(spot.name, function () {
        var p = new THREE.Vector3(spot.pos[0], 0, spot.pos[2]);
        var dir = p.clone().normalize();
        var cam = p.clone().add(dir.multiplyScalar(10)).setY(6.5);
        flyTo(cam, p.clone().setY(2));
      });
    });

    // ====== カメラ移動（チップ／導入） ======
    var tween = null;
    var userMoved = false;   /* 一度でも操作したら自動回転は戻さない */
    var booted = false;      /* 初回フレーム前の resize でホーム画角を上書きしない */
    function flyTo(camPos, tgt, dur, isIntro) {
      controls.autoRotate = false;
      if (!isIntro) userMoved = true;
      tween = {
        t0: performance.now(), dur: dur || 1200, intro: !!isIntro,
        c0: camera.position.clone(), c1: camPos.clone(),
        g0: controls.target.clone(), g1: tgt.clone()
      };
    }
    function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

    // ====== ホバー／クリック ======
    var ray = new THREE.Raycaster();
    var pointer = new THREE.Vector2();
    var hoverIdx = -1;
    function setHover(i) {
      if (i === hoverIdx) return;
      if (hoverIdx >= 0) {
        SPOTS[hoverIdx].mats.forEach(function (m) { m.emissive.setHex(0x000000); });
        SPOTS[hoverIdx].label.classList.remove('active');
      }
      hoverIdx = i;
      if (i >= 0) {
        SPOTS[i].mats.forEach(function (m) { m.emissive.setHex(0x2A1008); });
        SPOTS[i].label.classList.add('active');
      }
      canvas.classList.toggle('pickable', i >= 0);
    }
    function pick(e) {
      var r = canvas.getBoundingClientRect();
      pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
      pointer.y = -((e.clientY - r.top) / r.height) * 2 + 1;
      ray.setFromCamera(pointer, camera);
      var hit = ray.intersectObjects(pickables, false);
      return hit.length ? hit[0].object.userData.spot : -1;
    }
    function visit(spot) {
      if (spot.external) { window.open(spot.url, '_blank', 'noopener'); }
      else { window.location.href = spot.url; }
    }

    var downX = 0, downY = 0;
    canvas.addEventListener('pointerdown', function (e) {
      downX = e.clientX; downY = e.clientY;
      controls.autoRotate = false;
      userMoved = true;
      canvas.classList.add('grabbing');
    });
    canvas.addEventListener('pointerup', function (e) {
      canvas.classList.remove('grabbing');
      if (Math.abs(e.clientX - downX) < 7 && Math.abs(e.clientY - downY) < 7) {
        var i = pick(e);
        if (i >= 0) visit(SPOTS[i]);
      }
    });
    canvas.addEventListener('pointermove', function (e) {
      if (e.pointerType === 'touch') return;
      setHover(pick(e));
    });
    canvas.addEventListener('pointerleave', function () { setHover(-1); });

    // ====== リサイズ・描画ループ ======
    function resize() {
      var w = window.innerWidth, h = window.innerHeight;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      /* まだ操作していなければ、画面の縦横に合わせてホーム画角を取り直す（画面回転対応） */
      if (booted && !userMoved) {
        if (tween) { tween.c1.copy(homeCam()); tween.g1.copy(homeTgt()); }
        else { camera.position.copy(homeCam()); controls.target.copy(homeTgt()); }
      }
    }
    window.addEventListener('resize', resize);
    resize();

    var hidden = false;
    document.addEventListener('visibilitychange', function () { hidden = document.hidden; });

    var first = true;
    function loop(now) {
      requestAnimationFrame(loop);
      if (hidden) return;

      if (tween) {
        var k = Math.min(1, (now - tween.t0) / tween.dur);
        var e = ease(k);
        camera.position.lerpVectors(tween.c0, tween.c1, e);
        controls.target.lerpVectors(tween.g0, tween.g1, e);
        if (k >= 1) {
          if (tween.intro && !userMoved && !reduce) controls.autoRotate = true;
          tween = null;
        }
      }
      controls.update();

      if (!reduce) {
        var t = now * 0.001;
        canopy.forEach(function (s, i) { s.position.y = CANOPY[i].p[1] + Math.sin(t * 0.7 + i * 1.7) * 0.07; });
        if (seeds) {
          var arr = seeds.geometry.attributes.position.array;
          for (var i2 = 0; i2 < seedBase.length; i2++) {
            arr[i2 * 3 + 1] = seedBase[i2] + Math.sin(t * 0.5 + i2 * 0.9) * 0.4;
          }
          seeds.geometry.attributes.position.needsUpdate = true;
        }
      }

      placeLabels();
      renderer.render(scene, camera);

      if (first) {
        first = false;
        booted = true;
        veil.classList.add('done');
        if (!reduce) flyTo(homeCam(), homeTgt(), 2000, true);
      }
    }
    requestAnimationFrame(loop);
  })();
  </script>
</body>
</html>
